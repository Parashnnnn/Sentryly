[build]
  command = "npm run build"
  publish = "dist"

# SPA Fallback routing (all requests rewrite to index.html with 200 OK)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and PWA headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "geolocation=(self), bluetooth=(self), camera=(), microphone=()"

# Service worker must never be cached long-term
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Service-Worker-Allowed = "/"

# Hashed assets can be cached aggressively
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
